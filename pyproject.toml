[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "fx3-cyapi"
version = "0.1.0"
description = "Native asynchronous CyAPI acquisition engine with a PySide6 monitor"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "PySide6>=6.6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
fx3-monitor = "fx3_cyapi.gui:main"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python/fx3_cyapi"]
sdist.exclude = ["CyAPI/**", "CyUSB3_USB_Suite_Source/**", "artifacts/**", "dist/**", ".agents/**", ".codex/**", ".aws/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
